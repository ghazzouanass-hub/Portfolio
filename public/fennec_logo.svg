<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fennecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="foxOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#fennecGrad)" />

  <!-- Geometric Desert Fox (Fennec) Head Logo -->
  <g transform="translate(156, 110)">
    <!-- Left Large Ear -->
    <polygon points="100,160 20,20 80,120" fill="url(#foxOrange)" />
    <!-- Right Large Ear -->
    <polygon points="100,160 180,20 120,120" fill="url(#foxOrange)" />
    <!-- Center Face Polygon -->
    <polygon points="100,210 50,130 150,130" fill="#ffffff" />
    <!-- Fox Nose -->
    <polygon points="100,210 88,185 112,185" fill="#18181b" />
    <!-- Eyes -->
    <polygon points="70,150 85,160 75,165" fill="#f97316" />
    <polygon points="130,150 115,160 125,165" fill="#f97316" />
  </g>

  <!-- Typography -->
  <text x="256" y="415" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="8">FENNEC</text>
  <text x="256" y="445" text-anchor="middle" fill="#f97316" font-family="'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="4">CLOTHING & ATHLETICWEAR</text>
</svg>
