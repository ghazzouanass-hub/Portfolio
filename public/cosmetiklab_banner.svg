<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="cosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cosBg)" />

  <!-- Ambient Luxury Glow Circles -->
  <circle cx="950" cy="280" r="280" fill="#c026d3" opacity="0.15" />
  <circle cx="200" cy="500" r="220" fill="#e879f9" opacity="0.1" />

  <!-- Luxury Cosmetic Dropper Bottle Illustration (Right Side Graphic) -->
  <g transform="translate(760, 140)">
    <!-- Dropper Pipette Top -->
    <rect x="110" y="20" width="40" height="30" rx="10" fill="#334155" />
    <rect x="120" y="50" width="20" height="30" fill="url(#goldLuxury)" />
    <!-- Glass Cap Ring -->
    <rect x="90" y="80" width="80" height="35" rx="8" fill="url(#goldLuxury)" />
    
    <!-- Bottle Main Body -->
    <rect x="80" y="115" width="100" height="230" rx="24" fill="#ffffff" fill-opacity="0.9" stroke="url(#goldLuxury)" stroke-width="3" />
    
    <!-- Liquid Level Inside Bottle -->
    <rect x="90" y="180" width="80" height="150" rx="16" fill="url(#roseGold)" opacity="0.4" />
    
    <!-- White Label Print -->
    <rect x="92" y="190" width="76" height="90" rx="8" fill="#ffffff" />
    <text x="130" y="215" text-anchor="middle" fill="#701a75" font-family="'Inter', sans-serif" font-weight="900" font-size="10" letter-spacing="1">LAB SERUM</text>
    <text x="130" y="235" text-anchor="middle" fill="#334155" font-family="'Inter', sans-serif" font-weight="600" font-size="8">WHITE LABEL</text>
    <line x1="105" y1="245" x2="155" y2="245" stroke="#ca8a04" stroke-width="1" />
    <text x="130" y="260" text-anchor="middle" fill="#ca8a04" font-family="'Inter', sans-serif" font-weight="700" font-size="8">50ML / 1.7 OZ</text>

    <!-- Dropper Liquid Drip -->
    <circle cx="130" cy="380" r="10" fill="url(#roseGold)" />
  </g>

  <!-- Left Main Information Glass Box -->
  <rect x="80" y="100" width="580" height="475" rx="32" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Brand Emblem -->
  <rect x="120" y="140" width="60" height="60" rx="18" fill="url(#goldLuxury)" />
  <circle cx="150" cy="170" r="16" fill="#701a75" />
  
  <text x="200" y="165" fill="url(#goldLuxury)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="3">COSMETIC FORMULATION LAB</text>
  <text x="200" y="195" fill="#ffffff" font-family="'Playfair Display', serif" font-weight="900" font-size="30">COSMETIKLAB</text>

  <text x="120" y="260" fill="#fbcfe8" font-family="'Inter', sans-serif" font-weight="600" font-size="20">White-Label & Private Label Skincare Solutions</text>
  <text x="120" y="295" fill="#e9d5ff" font-family="'Inter', sans-serif" font-weight="400" font-size="14">
    Specialized cosmetic formulation laboratory offering bespoke skincare lines,
  </text>
  <text x="120" y="318" fill="#e9d5ff" font-family="'Inter', sans-serif" font-weight="400" font-size="14">
    white-label packaging, ISO-standard lab testing, and brand launching.
  </text>

  <!-- Highlight Cards -->
  <g transform="translate(120, 360)">
    <rect x="0" y="0" width="140" height="85" rx="16" fill="#000000" fill-opacity="0.3" stroke="url(#goldLuxury)" stroke-opacity="0.4" />
    <text x="16" y="32" fill="url(#goldLuxury)" font-family="'Inter', sans-serif" font-size="11" font-weight="700">SERVICES</text>
    <text x="16" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">White-Label</text>

    <rect x="155" y="0" width="140" height="85" rx="16" fill="#000000" fill-opacity="0.3" stroke="url(#goldLuxury)" stroke-opacity="0.4" />
    <text x="171" y="32" fill="url(#goldLuxury)" font-family="'Inter', sans-serif" font-size="11" font-weight="700">PRODUCTS</text>
    <text x="171" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">Skincare</text>

    <rect x="310" y="0" width="140" height="85" rx="16" fill="#000000" fill-opacity="0.3" stroke="url(#goldLuxury)" stroke-opacity="0.4" />
    <text x="326" y="32" fill="url(#goldLuxury)" font-family="'Inter', sans-serif" font-size="11" font-weight="700">QUALITY</text>
    <text x="326" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">ISO Lab</text>
  </g>

  <!-- Tag -->
  <rect x="120" y="480" width="230" height="44" rx="12" fill="url(#goldLuxury)" />
  <text x="235" y="507" text-anchor="middle" fill="#4a044e" font-family="'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="1">PRIVATE LABEL COSMETICS</text>
</svg>
