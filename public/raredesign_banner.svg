<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="rareBannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#rareBannerBg)" />

  <!-- Streetwear T-Shirt & Hoodie Outline Graphic (Right Side) -->
  <g transform="translate(740, 150)">
    <!-- Oversized Streetwear Hoodie Silhouette -->
    <path d="M 120 40 L 40 90 L 10 180 L 70 190 L 70 360 L 270 360 L 270 190 L 330 180 L 300 90 L 220 40 Q 170 80 120 40 Z" fill="#0f172a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- Hoodie Strings -->
    <line x1="150" y1="70" x2="150" y2="150" stroke="#cbd5e1" stroke-width="3" />
    <line x1="190" y1="70" x2="190" y2="150" stroke="#cbd5e1" stroke-width="3" />
    <!-- Kangaroo Pocket -->
    <path d="M 90 280 H 250 L 230 350 H 110 Z" fill="none" stroke="#ffffff" stroke-width="2" />
    
    <!-- Chest Printed Brand Graphic -->
    <text x="170" y="200" text-anchor="middle" fill="url(#silverGlow)" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="4">RARE DESIGN</text>
    <text x="170" y="220" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="10" letter-spacing="2">LIMITED COLLECTION</text>
  </g>

  <!-- Left Main Content Glass Card -->
  <rect x="80" y="100" width="580" height="475" rx="32" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Emblem -->
  <rect x="120" y="140" width="60" height="60" rx="18" fill="#ffffff" />
  <text x="150" y="180" text-anchor="middle" fill="#020617" font-family="'Inter', sans-serif" font-weight="900" font-size="32">R</text>

  <text x="200" y="165" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="3">CLOTHING & STREETWEAR BRAND</text>
  <text x="200" y="195" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="32" letter-spacing="2">RARE DESIGN</text>

  <text x="120" y="260" fill="#f1f5f9" font-family="'Inter', sans-serif" font-weight="600" font-size="20">Bespoke Apparel, Hoodies & Streetwear</text>
  <text x="120" y="295" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="400" font-size="14">
    Independent high-fashion streetwear label with custom cuts, heavy fabrics,
  </text>
  <text x="120" y="318" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="400" font-size="14">
    vector artwork prints, Shopify store integration, and social campaign scaling.
  </text>

  <!-- Highlight Cards -->
  <g transform="translate(120, 360)">
    <rect x="0" y="0" width="140" height="85" rx="16" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="16" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="700">CATEGORY</text>
    <text x="16" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">Streetwear</text>

    <rect x="155" y="0" width="140" height="85" rx="16" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="171" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STORE</text>
    <text x="171" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">Shopify</text>

    <rect x="310" y="0" width="140" height="85" rx="16" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="326" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="700">DIRECT</text>
    <text x="326" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">D2C Brand</text>
  </g>

  <!-- Tag -->
  <rect x="120" y="480" width="220" height="44" rx="12" fill="#ffffff" />
  <text x="230" y="507" text-anchor="middle" fill="#020617" font-family="'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="1">RARE DESIGN CLOTHING</text>
</svg>
