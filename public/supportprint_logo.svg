<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="print_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cmyk_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cmyk_m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="cmyk_y" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0F172A" stroke="url(#print_grad)" stroke-width="2"/>
  <!-- Printer / Engraving Plotter Body -->
  <rect x="22" y="38" width="56" height="30" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <!-- Paper / Substrate Sheet Coming Out -->
  <path d="M30 38 V22 H70 V38" stroke="#94A3B8" stroke-width="2" fill="#F8FAFC" fill-opacity="0.9"/>
  <rect x="30" y="54" width="40" height="24" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Roland Laser / Diamond Engraver Stylus Focus -->
  <circle cx="50" cy="53" r="5" fill="#EF4444" fill-opacity="0.8"/>
  <line x1="50" y1="44" x2="50" y2="50" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <!-- CMYK Process Alignment Dots -->
  <circle cx="38" cy="66" r="2.5" fill="url(#cmyk_c)"/>
  <circle cx="46" cy="66" r="2.5" fill="url(#cmyk_m)"/>
  <circle cx="54" cy="66" r="2.5" fill="url(#cmyk_y)"/>
  <circle cx="62" cy="66" r="2.5" fill="#0F172A"/>
</svg>
