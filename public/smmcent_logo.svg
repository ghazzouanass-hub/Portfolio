<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="smmcent_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="smmcent_inner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#smmcent_grad)" fill-opacity="0.15" stroke="url(#smmcent_grad)" stroke-width="2"/>
  <!-- Central Connected Network S Shape -->
  <circle cx="50" cy="28" r="8" fill="url(#smmcent_grad)"/>
  <circle cx="32" cy="50" r="7" fill="url(#smmcent_inner)"/>
  <circle cx="68" cy="50" r="7" fill="url(#smmcent_inner)"/>
  <circle cx="50" cy="72" r="8" fill="url(#smmcent_grad)"/>
  <!-- Connecting lines -->
  <path d="M50 28 L32 50 L50 72 L68 50 Z" stroke="url(#smmcent_grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 28 L68 50" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 50 L50 72" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <!-- Central Core Pulse -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF"/>
</svg>
